<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Documentation — DevWeekends</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/docs/assets/swagger-ui.css">
<style>
  /* Swagger UI brings its own styles; these few rules line it up with the
     rest of the site (green instead of blue, our fonts, no floating topbar). */

  body { background: var(--paper); }

  .swagger-ui .topbar { display: none; }

  .swagger-ui .wrapper { max-width: 1100px; }

  .swagger-ui .info { margin: 34px 0 22px; }

  .swagger-ui .info .title,
  .swagger-ui .opblock-tag {
    font-family: Georgia, "Iowan Old Style", serif;
    letter-spacing: -0.3px;
  }

  .swagger-ui .info .title small.version-stamp { background: var(--green); }

  .swagger-ui .btn.authorize,
  .swagger-ui .btn.authorize svg { color: var(--green); fill: var(--green); }
  .swagger-ui .btn.authorize { border-color: var(--green); }

  .swagger-ui .opblock.opblock-post { border-color: var(--green); background: #f3f9f6; }
  .swagger-ui .opblock.opblock-post .opblock-summary-method { background: var(--green); }

  .swagger-ui .btn.execute {
    background: var(--green);
    border-color: var(--green);
  }

  .swagger-ui select { font-family: inherit; }
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">dev<span>weekends</span></a>
    <nav></nav>
  </div>
</header>

<div id="swagger"></div>

<script src="/app.js"></script>
<script src="/docs/assets/swagger-ui-bundle.js"></script>
<script src="/docs/assets/swagger-ui-standalone-preset.js"></script>
<script>
window.ui = SwaggerUIBundle({
  url: '/openapi.json',
  dom_id: '#swagger',
  deepLinking: true,
  displayRequestDuration: true,
  filter: true,
  tryItOutEnabled: true,
  presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
  layout: 'BaseLayout',

  // if you are already logged in on the site, Authorize is filled in for you
  onComplete: function () {
    var token = getToken();
    if (token) ui.preauthorizeApiKey('bearerAuth', token);
  },

  // logging in through "Try it out" keeps you logged in on the rest of the site
  responseInterceptor: function (response) {
    if (response.body && response.body.token && response.body.user) {
      saveLogin(response.body);
      ui.preauthorizeApiKey('bearerAuth', response.body.token);
      buildNav();
    }
    return response;
  }
});
</script>
</body>
</html>
