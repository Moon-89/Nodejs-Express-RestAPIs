<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Documentation</title>
<link rel="stylesheet" href="/swagger/swagger-ui.css">
<style>
  /* Swagger UI ships its own styles; these few rules calm the default blue down
     and give the page a plain header. */

  body { margin: 0; background: #fafafa; }

  .page-head {
    background: #fff;
    border-bottom: 1px solid #e4e4e4;
    padding: 16px 22px;
    font: 600 17px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2328;
  }

  .page-head span { color: #14634a; font-weight: 400; font-size: 14px; margin-left: 10px; }

  .swagger-ui .wrapper { max-width: 1100px; }
  .swagger-ui .info { margin: 30px 0 20px; }

  .swagger-ui .btn.authorize,
  .swagger-ui .btn.authorize svg { color: #14634a; fill: #14634a; }
  .swagger-ui .btn.authorize { border-color: #14634a; }

  .swagger-ui .opblock.opblock-post { border-color: #14634a; background: #f3f9f6; }
  .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #14634a; }

  .swagger-ui .btn.execute { background: #14634a; border-color: #14634a; }
</style>
</head>
<body>

<div class="page-head">
  DevWeekends API
  <span>Express · Mongoose · MongoDB Atlas</span>
</div>

<div id="swagger"></div>

<script src="/swagger/swagger-ui-bundle.js"></script>
<script>
window.ui = SwaggerUIBundle({
  url: '/openapi.json',
  dom_id: '#swagger',
  deepLinking: true,
  displayRequestDuration: true,
  filter: true,
  tryItOutEnabled: true,
  presets: [SwaggerUIBundle.presets.apis],
  layout: 'BaseLayout',

  // keep the token from a register/login call, so the locked endpoints can be
  // tried straight afterwards without copying it into Authorize by hand
  responseInterceptor: function (response) {
    if (response.body && response.body.token) {
      ui.preauthorizeApiKey('bearerAuth', response.body.token);
    }
    return response;
  }
});
</script>
</body>
</html>
