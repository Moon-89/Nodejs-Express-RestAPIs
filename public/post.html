<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post — DevWeekends</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">dev<span>weekends</span></a>
    <nav></nav>
  </div>
</header>

<div class="wrap">

  <div id="postArea"><p class="muted small" style="padding-top: 40px">Loading…</p></div>

  <h2>Comments <span id="commentCount"></span></h2>

  <div id="commentForm" hidden>
    <p id="commentMsg" hidden></p>
    <form id="newComment">
      <textarea id="commentBody" required placeholder="Add a comment" style="min-height: 90px"></textarea>
      <button type="submit">Post comment</button>
    </form>
  </div>

  <p class="notice" id="commentLoginNote" hidden>
    <a href="/login.html">Log in</a> to join the conversation.
  </p>

  <div id="commentList"></div>

  <a class="back-link" href="/">← Back to all posts</a>

  <footer>Built with Express, Mongoose and MongoDB Atlas.</footer>
</div>

<script src="/app.js"></script>
<script>
var postId = new URLSearchParams(location.search).get('id');
var post = null;

if (!postId) {
  location.href = '/';
}

async function loadPost() {
  var area = document.getElementById('postArea');

  try {
    post = await api('/posts/' + postId);
  } catch (err) {
    area.innerHTML = '<p class="msg error" style="margin-top: 30px">' + escapeHtml(err.message) + '</p>';
    document.title = 'Not found — DevWeekends';
    return;
  }

  document.title = post.title + ' — DevWeekends';

  var author = post.author ? post.author.name : 'Unknown';
  var tags = (post.tags || []).map(function (t) {
    return '<a class="tag" href="/?tag=' + encodeURIComponent(t) + '">' + escapeHtml(t) + '</a>';
  }).join('');

  area.innerHTML =
    '<div class="article-head">' +
      '<h1>' + escapeHtml(post.title) + '</h1>' +
      '<div class="byline">' + avatar(author, 'big') +
        '<b>' + escapeHtml(author) + '</b>' +
        '<span class="dot">·</span>' + formatDate(post.createdAt) +
        '<span class="dot">·</span>' + readingTime(post.content) +
      '</div>' +
    '</div>' +
    '<div class="article-body">' + escapeHtml(post.content) + '</div>' +
    tags;

  // edit and delete only make sense for the author — the API rejects anyone else with 403
  var user = getUser();
  if (user && post.author && post.author._id === user._id) {
    area.innerHTML +=
      '<div class="owner-actions">' +
      '<button class="secondary small" id="editBtn">Edit post</button>' +
      '<button class="secondary small" id="deleteBtn">Delete</button>' +
      '</div>';
    document.getElementById('editBtn').onclick = startEdit;
    document.getElementById('deleteBtn').onclick = deletePost;
  }
}

function startEdit() {
  var area = document.getElementById('postArea');
  area.innerHTML =
    '<div class="article-head"><h1>Edit post</h1></div>' +
    '<div class="card">' +
    '<p id="editMsg" hidden></p>' +
    '<form id="editForm">' +
    '<label for="editTitle">Title</label>' +
    '<input id="editTitle" required>' +
    '<label for="editContent">Content</label>' +
    '<textarea id="editContent" required></textarea>' +
    '<label for="editTags">Tags</label>' +
    '<input id="editTags">' +
    '<button type="submit">Save changes</button> ' +
    '<button type="button" class="secondary" id="cancelEdit">Cancel</button>' +
    '</form></div>';

  document.getElementById('editTitle').value = post.title;
  document.getElementById('editContent').value = post.content;
  document.getElementById('editTags').value = (post.tags || []).join(', ');

  document.getElementById('cancelEdit').onclick = loadPost;

  document.getElementById('editForm').onsubmit = async function (e) {
    e.preventDefault();
    var tags = document.getElementById('editTags').value
      .split(',')
      .map(function (t) { return t.trim(); })
      .filter(Boolean);

    try {
      await api('/posts/' + postId, 'PUT', {
        title: document.getElementById('editTitle').value,
        content: document.getElementById('editContent').value,
        tags: tags
      });
    } catch (err) {
      showError(document.getElementById('editMsg'), err.message);
      return;
    }
    loadPost();
  };
}

async function deletePost() {
  if (!confirm('Delete this post? Its comments go too.')) return;

  try {
    await api('/posts/' + postId, 'DELETE');
  } catch (err) {
    alert(err.message);
    return;
  }
  location.href = '/';
}

async function loadComments() {
  var box = document.getElementById('commentList');

  try {
    var data = await api('/posts/' + postId + '/comments');
  } catch (err) {
    box.innerHTML = '<p class="msg error">' + escapeHtml(err.message) + '</p>';
    return;
  }

  document.getElementById('commentCount').textContent = data.total ? '(' + data.total + ')' : '';

  if (data.items.length === 0) {
    box.innerHTML = '<p class="muted small">No comments yet.</p>';
    return;
  }

  var user = getUser();

  box.innerHTML = data.items.map(function (c) {
    var name = c.author ? c.author.name : 'Unknown';
    var mine = user && c.author && c.author._id === user._id;
    return '<div class="comment">' + avatar(name) +
      '<div class="body">' +
        '<p>' + escapeHtml(c.body) + '</p>' +
        '<span class="comment-meta">' + escapeHtml(name) + ' · ' + formatDate(c.createdAt) + '</span>' +
        (mine ? '<button class="link-btn" data-id="' + c._id + '">delete</button>' : '') +
      '</div></div>';
  }).join('');
}

document.getElementById('commentList').onclick = async function (e) {
  var btn = e.target.closest('button[data-id]');
  if (!btn) return;

  try {
    await api('/comments/' + btn.dataset.id, 'DELETE');
  } catch (err) {
    alert(err.message);
    return;
  }
  loadComments();
};

document.getElementById('newComment').onsubmit = async function (e) {
  e.preventDefault();
  var msg = document.getElementById('commentMsg');
  msg.hidden = true;

  try {
    await api('/posts/' + postId + '/comments', 'POST', {
      body: document.getElementById('commentBody').value
    });
  } catch (err) {
    showError(msg, err.message);
    return;
  }

  document.getElementById('commentBody').value = '';
  loadComments();
};

if (getToken()) {
  document.getElementById('commentForm').hidden = false;
} else {
  document.getElementById('commentLoginNote').hidden = false;
}

loadPost();
loadComments();
</script>
</body>
</html>
