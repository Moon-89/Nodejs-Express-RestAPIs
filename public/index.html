<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevWeekends</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/">dev<span>weekends</span></a>
    <nav></nav>
  </div>
</header>

<div class="wrap">

  <div class="masthead home">
    <p class="kicker">Node · Express · MongoDB</p>
    <h1>Notes from the weekend build</h1>
    <p>Whatever I picked up this week about Node, Express and MongoDB — written down before I forget it.</p>
    <div class="actions" id="actions"></div>
  </div>

  <div id="writeBox" hidden>
    <div class="card">
      <p id="formMsg" hidden></p>
      <form id="postForm">
        <label for="title">Title</label>
        <input id="title" required maxlength="120" placeholder="What did you learn?">

        <label for="content">Content</label>
        <textarea id="content" required></textarea>

        <label for="tags">Tags <span class="muted">— comma separated, optional</span></label>
        <input id="tags" placeholder="node, mongodb">

        <button type="submit">Publish</button>
        <button type="button" class="secondary" id="cancelWrite">Cancel</button>
      </form>
    </div>
  </div>

  <div class="chips" id="chips" hidden></div>

  <div class="feed-bar">
    <h2 id="countLine">Latest</h2>
    <div class="search-row">
      <input id="search" placeholder="Search titles">
      <button class="secondary small" id="searchBtn">Search</button>
    </div>
  </div>

  <p class="small" id="filterNote" hidden></p>

  <div id="list"><p class="muted small">Loading…</p></div>

  <div class="pager" id="pager" hidden>
    <button class="secondary small" id="prev">Previous</button>
    <button class="secondary small" id="next">Next</button>
    <span id="pageInfo"></span>
  </div>

  <footer>Built with Express, Mongoose and MongoDB Atlas.</footer>
</div>

<script src="/app.js"></script>
<script>
var page = 1;
var query = '';
var tag = '';

// the feed is public, so this runs whether or not anyone is logged in
async function loadPosts() {
  var url = '/posts?page=' + page + '&limit=5';
  if (query) url += '&q=' + encodeURIComponent(query);
  if (tag) url += '&tag=' + encodeURIComponent(tag);

  var list = document.getElementById('list');

  try {
    var data = await api(url);
  } catch (err) {
    list.innerHTML = '<p class="msg error">' + escapeHtml(err.message) + '</p>';
    return;
  }

  document.getElementById('countLine').textContent =
    query || tag ? data.total + ' result' + (data.total === 1 ? '' : 's') : 'Latest';

  if (data.items.length === 0) {
    list.innerHTML = '<div class="empty">' +
      (query || tag ? 'Nothing matched that.' : 'No posts yet — write the first one.') +
      '</div>';
  } else {
    list.innerHTML = data.items.map(function (post, i) {
      // only on page one is the first item actually the newest post
      return postHtml(post, i === 0 && data.page === 1 && !query && !tag);
    }).join('');
  }

  showChips(data.items);

  document.getElementById('pager').hidden = data.pages < 2;
  document.getElementById('pageInfo').textContent = 'Page ' + data.page + ' of ' + data.pages;
  document.getElementById('prev').disabled = data.page <= 1;
  document.getElementById('next').disabled = data.page >= data.pages;
}

function postHtml(post, lead) {
  var author = post.author ? post.author.name : 'Unknown';
  var tags = (post.tags || []).map(function (t) {
    return '<a class="tag" href="?tag=' + encodeURIComponent(t) + '">' + escapeHtml(t) + '</a>';
  }).join('');

  var cut = lead ? 320 : 200;
  var text = post.content.length > cut ? post.content.slice(0, cut) + '…' : post.content;

  return '<article class="post' + (lead ? ' lead' : '') + '">' +
    '<h3><a href="/post.html?id=' + post._id + '">' + escapeHtml(post.title) + '</a></h3>' +
    '<div class="byline">' + avatar(author) +
      '<b>' + escapeHtml(author) + '</b>' +
      '<span class="dot">·</span>' + formatDate(post.createdAt) +
      '<span class="dot">·</span>' + readingTime(post.content) +
    '</div>' +
    '<p class="excerpt">' + escapeHtml(text) + '</p>' +
    tags +
    (post.content.length > cut
      ? '<br><a class="more" href="/post.html?id=' + post._id + '">Read the rest →</a>'
      : '') +
    '</article>';
}

// tags collected from the posts currently on screen, as quick filters
function showChips(items) {
  var box = document.getElementById('chips');
  var seen = [];

  items.forEach(function (post) {
    (post.tags || []).forEach(function (t) {
      if (seen.indexOf(t) === -1) seen.push(t);
    });
  });

  if (seen.length === 0) {
    box.hidden = true;
    return;
  }

  box.innerHTML = '<span>Tags</span>' + seen.map(function (t) {
    return '<a class="' + (t === tag ? 'on' : '') + '" href="?tag=' + encodeURIComponent(t) + '">' +
      escapeHtml(t) + '</a>';
  }).join('') + (tag ? '<a href="/">clear</a>' : '');

  box.hidden = false;
}

function toggleWrite(show) {
  document.getElementById('writeBox').hidden = !show;
  if (show) document.getElementById('title').focus();
}

document.getElementById('postForm').onsubmit = async function (e) {
  e.preventDefault();
  var msg = document.getElementById('formMsg');
  msg.hidden = true;

  var tags = document.getElementById('tags').value
    .split(',')
    .map(function (t) { return t.trim(); })
    .filter(Boolean);

  try {
    await api('/posts', 'POST', {
      title: document.getElementById('title').value,
      content: document.getElementById('content').value,
      tags: tags
    });
  } catch (err) {
    showError(msg, err.message);
    return;
  }

  this.reset();
  toggleWrite(false);
  page = 1;
  query = '';
  tag = '';
  loadPosts();
};

document.getElementById('cancelWrite').onclick = function () { toggleWrite(false); };

document.getElementById('searchBtn').onclick = function () {
  query = document.getElementById('search').value.trim();
  page = 1;
  loadPosts();
};

document.getElementById('search').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

document.getElementById('prev').onclick = function () { page--; loadPosts(); window.scrollTo(0, 0); };
document.getElementById('next').onclick = function () { page++; loadPosts(); window.scrollTo(0, 0); };

// ?tag=node in the address bar filters the feed
tag = new URLSearchParams(location.search).get('tag') || '';
if (tag) {
  var note = document.getElementById('filterNote');
  note.innerHTML = 'Tagged <b>' + escapeHtml(tag) + '</b> — <a href="/">show everything</a>';
  note.hidden = false;
}

// the write form stays folded away until it is wanted, so the posts come first
if (getToken()) {
  document.getElementById('actions').innerHTML =
    '<button id="writeBtn">Write a post</button>';
  document.getElementById('writeBtn').onclick = function () {
    toggleWrite(document.getElementById('writeBox').hidden);
  };
} else {
  document.getElementById('actions').innerHTML =
    '<a class="tag" href="/login.html" style="padding: 7px 16px">Log in to write</a>' +
    '<span class="muted">Reading needs no account.</span>';
}

loadPosts();
</script>
</body>
</html>
